<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title description">
  <title id="title">How MediaSpace works</title>
  <desc id="description">An architecture diagram showing an administrator uploading photos to Vercel Blob and videos to Mux, metadata being stored in Neon, and the Next.js application serving public galleries, albums, and video pages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5936f3"/>
      <stop offset="1" stop-color="#8a5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7657e8"/>
    </marker>
    <style>
      .title { font: 700 42px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #eeeaff; }
      .eyebrow { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #6c4be7; }
      .box-title { font: 700 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .box-copy { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526078; }
      .label { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7657e8; }
      .step { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #617089; }
      .arrow { fill: none; stroke: #7657e8; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #7f8ba3; stroke-width: 3; stroke-dasharray: 9 9; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="960" rx="32" fill="url(#background)"/>
  <rect x="28" y="28" width="1344" height="132" rx="26" fill="url(#header)"/>
  <text x="76" y="78" class="subtitle" style="font-weight:700;letter-spacing:3px">MEDIASPACE</text>
  <text x="76" y="126" class="title">How media moves through the app</text>
  <text x="955" y="91" class="subtitle">Photos, videos, details, albums</text>
  <text x="955" y="122" class="subtitle">and public pages working together</text>

  <!-- Admin -->
  <g filter="url(#shadow)">
    <rect x="64" y="216" width="258" height="164" rx="22" fill="#ffffff" stroke="#dcd5ff" stroke-width="2"/>
  </g>
  <circle cx="100" cy="250" r="18" fill="#7657e8"/>
  <text x="100" y="256" text-anchor="middle" class="step">1</text>
  <text x="130" y="257" class="box-title">Administrator</text>
  <text x="88" y="298" class="box-copy">Signs in at /admin</text>
  <text x="88" y="326" class="box-copy">Uploads and organizes media</text>
  <text x="88" y="354" class="box-copy">Edits titles and descriptions</text>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="404" y="216" width="298" height="164" rx="22" fill="#ffffff" stroke="#dcd5ff" stroke-width="2"/>
  </g>
  <circle cx="442" cy="250" r="18" fill="#7657e8"/>
  <text x="442" y="256" text-anchor="middle" class="step">2</text>
  <text x="472" y="257" class="box-title">Browser</text>
  <text x="430" y="298" class="box-copy">Checks file type and video length</text>
  <text x="430" y="326" class="box-copy">Shows progress and cancellation</text>
  <text x="430" y="354" class="box-copy">Sends files directly to storage</text>

  <path d="M322 298 C350 298 370 298 404 298" class="arrow"/>
  <text x="363" y="281" text-anchor="middle" class="label">SELECT</text>

  <!-- Photo storage -->
  <g filter="url(#shadow)">
    <rect x="792" y="190" width="256" height="150" rx="22" fill="#ffffff" stroke="#bfe7dc" stroke-width="2"/>
  </g>
  <circle cx="830" cy="224" r="18" fill="#18a77b"/>
  <text x="830" y="230" text-anchor="middle" class="step">3</text>
  <text x="860" y="231" class="box-title">Vercel Blob</text>
  <text x="818" y="273" class="box-copy">Stores original photos</text>
  <text x="818" y="301" class="box-copy">Returns a public image URL</text>

  <!-- Video storage -->
  <g filter="url(#shadow)">
    <rect x="792" y="372" width="256" height="150" rx="22" fill="#ffffff" stroke="#f1c4d8" stroke-width="2"/>
  </g>
  <circle cx="830" cy="406" r="18" fill="#e04b86"/>
  <text x="830" y="412" text-anchor="middle" class="step">3</text>
  <text x="860" y="413" class="box-title">Mux Video</text>
  <text x="818" y="455" class="box-copy">Processes uploaded videos</text>
  <text x="818" y="483" class="box-copy">Creates streaming and thumbnails</text>

  <path d="M702 276 C744 276 752 265 792 265" class="arrow"/>
  <text x="746" y="249" text-anchor="middle" class="label">PHOTOS</text>
  <path d="M702 326 C746 326 748 447 792 447" class="arrow"/>
  <text x="748" y="386" text-anchor="middle" class="label">VIDEOS</text>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="1110" y="252" width="230" height="208" rx="22" fill="#ffffff" stroke="#c7dcff" stroke-width="2"/>
  </g>
  <circle cx="1148" cy="287" r="18" fill="#3978d3"/>
  <text x="1148" y="293" text-anchor="middle" class="step">4</text>
  <text x="1178" y="294" class="box-title">Neon</text>
  <text x="1136" y="335" class="box-copy">Stores media records:</text>
  <text x="1136" y="363" class="box-copy">URLs and playback IDs</text>
  <text x="1136" y="391" class="box-copy">Titles, details and dates</text>
  <text x="1136" y="419" class="box-copy">Albums and fingerprints</text>

  <path d="M1048 265 C1075 265 1080 320 1110 320" class="arrow"/>
  <path d="M1048 447 C1075 447 1080 400 1110 400" class="arrow"/>

  <!-- Next.js -->
  <g filter="url(#shadow)">
    <rect x="426" y="584" width="548" height="196" rx="26" fill="#172033"/>
  </g>
  <circle cx="470" cy="624" r="19" fill="#7657e8"/>
  <text x="470" y="630" text-anchor="middle" class="step">5</text>
  <text x="505" y="632" class="box-title" style="fill:#ffffff">Next.js application on Vercel</text>
  <text x="466" y="676" class="box-copy" style="fill:#c8d0df">Builds the public gallery and album pages</text>
  <text x="466" y="706" class="box-copy" style="fill:#c8d0df">Creates individual /videos/[id] pages for sharing and SEO</text>
  <text x="466" y="736" class="box-copy" style="fill:#c8d0df">Protects uploads, edits, deletion and settings for the admin</text>

  <path d="M1225 460 C1225 548 1028 564 918 584" class="arrow"/>
  <text x="1129" y="541" text-anchor="middle" class="label">MEDIA DATA</text>
  <path d="M920 340 C920 540 846 548 823 584" class="arrow-dashed"/>
  <path d="M920 522 C920 548 886 558 867 584" class="arrow-dashed"/>

  <!-- Public users -->
  <g filter="url(#shadow)">
    <rect x="1050" y="604" width="290" height="156" rx="22" fill="#ffffff" stroke="#dcd5ff" stroke-width="2"/>
  </g>
  <circle cx="1088" cy="640" r="18" fill="#7657e8"/>
  <text x="1088" y="646" text-anchor="middle" class="step">6</text>
  <text x="1118" y="647" class="box-title">Public visitors</text>
  <text x="1076" y="689" class="box-copy">Browse photos and videos</text>
  <text x="1076" y="717" class="box-copy">Open albums and video pages</text>
  <text x="1076" y="745" class="box-copy">No editing controls are shown</text>

  <path d="M974 682 C1004 682 1014 682 1050 682" class="arrow"/>
  <text x="1012" y="665" text-anchor="middle" class="label">VIEW</text>

  <!-- Local development lane -->
  <rect x="64" y="838" width="1276" height="76" rx="18" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  <text x="92" y="869" class="eyebrow">LOCAL DEVELOPMENT</text>
  <text x="92" y="897" class="small">Without cloud credentials, photos use public/uploads and media records use data/media.json. Cloud services are used when configured.</text>

  <rect x="64" y="792" width="18" height="18" rx="5" fill="#18a77b"/>
  <text x="92" y="807" class="small">Photo bytes</text>
  <rect x="214" y="792" width="18" height="18" rx="5" fill="#e04b86"/>
  <text x="242" y="807" class="small">Video streaming</text>
  <rect x="400" y="792" width="18" height="18" rx="5" fill="#3978d3"/>
  <text x="428" y="807" class="small">Metadata</text>
  <text x="1048" y="807" class="small">Direct uploads keep large video files out of Vercel Functions.</text>
</svg>
